name: Build Nara TTS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          rm -rf _src
          mkdir _src
          unzip -q -o nara-tts.zip -d _src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test frontend
        timeout-minutes: 8
        continue-on-error: true
        working-directory: _src/nara-tts
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest -i

      - name: Build APK
        timeout-minutes: 25
        working-directory: _src/nara-tts
        run: gradle --no-daemon --console=plain :app:assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp _src/nara-tts/app/build/outputs/apk/debug/*.apk out/NaraTTS.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nara TTS build ${{ github.run_number }}
          files: out/NaraTTS.apk
